html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{
  margin:0; min-height:100vh; color:var(--ink);

}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">solar<b>tronics</b><span class="sep">/</span><em>Bedarfsprognose</em></div>
  </header>
  <main id="app"></main>
</div>
<input type="file" id="file" accept=".csv,.txt,text/csv" hidden>

<script>
/* =====================================================================
   KONFIGURATION
   Les articles au format H07V-K-<section>-Set<numéro>-fba sont reconnus
   automatiquement (ex. H07V-K-10-Set10-fba → SET10, 10 mm², 5 couleurs × 2 m).
   Pour un article différent, ajouter une ligne ici :
     'MON-SKU': { set:'SET14', qs:'10 mm²', colors:['Blau','Schwarz'], mPerColor:2 },
   ===================================================================== */
const SKU_MAP = {
};
const COLORS_DEFAULT = ['Blau','Braun','Gelbgrün','Grau','Schwarz'];
const M_PER_COLOR_DEFAULT = 2;
const STORE_KEY = 'solartronics.bedarfsprognose.v1';

/* ---------------------------- Datum-Helfer --------------------------- */
const DAY = 86400000;
const dn = (y,m,d) => Math.floor(Date.UTC(y,m-1,d)/DAY);
const dnToIso = n => new Date(n*DAY).toISOString().slice(0,10);
const isoToDn = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? dn(+m[1],+m[2],+m[3]) : null; };
const pad2 = n => String(n).padStart(2,'0');
const dnToDe = n => { const d=new Date(n*DAY); return pad2(d.getUTCDate())+'.'+pad2(d.getUTCMonth()+1)+'.'+d.getUTCFullYear(); };
const dnToShort = n => { const d=new Date(n*DAY); return pad2(d.getUTCDate())+'.'+pad2(d.getUTCMonth()+1)+'.'; };
const monthOf = n => new Date(n*DAY).getUTCMonth()+1;
const weekdayOf = n => new Date(n*DAY).getUTCDay();

function parseDate(raw){
  if(raw==null) return null;
  const s=String(raw).trim().replace(/^"|"$/g,'');
  let m, y, mo, d;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s))){ d=+m[1]; mo=+m[2]; y=+m[3]; }
  else if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s))){
    const a=+m[1], b=+m[2]; y=+m[3];
    if(a>12){ d=a; mo=b; } else if(b>12){ mo=a; d=b; } else { d=a; mo=b; }
  } else return null;
  if(mo<1||mo>12||d<1||d>31) return null;
  const t=new Date(Date.UTC(y,mo-1,d));
  if(t.getUTCMonth()!==mo-1) return null;
  return dn(y,mo,d);
}
function parseUnits(raw){
  let s=String(raw==null?'':raw).trim().replace(/\s/g,'');
  if(s==='') return NaN;
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  else s=s.replace(',','.');
  const v=parseFloat(s);
  return isFinite(v) ? Math.round(v) : NaN;
}

/* ------------------------------ CSV lesen ---------------------------- */
function detectDelimiter(text){
  const lines=text.split(/\r\n|\r|\n/).filter(l=>l.trim()!=='').slice(0,8);
  const cnt={';':0,',':0,'\t':0};
  for(const l of lines) for(const k in cnt) cnt[k]+=l.split(k).length-1;
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0] || ';';
}
function parseDelimited(text, delim){
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else if(c==='"') inQ=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(cur); cur='';
      if(row.length>1||row[0]!=='') rows.push(row);
      row=[];
    } else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); if(row.length>1||row[0]!=='') rows.push(row); }
  return rows;
}
const norm = s => String(s==null?'':s).replace(/^\ufeff/,'').toLowerCase().replace(/["']/g,'').trim();
function findCol(h, exact, contains, exclude){
  for(const e of exact){ const i=h.indexOf(e); if(i>=0) return i; }
  for(let i=0;i<h.length;i++){
    if(exclude.some(x=>h[i].includes(x))) continue;
    if(contains.some(x=>h[i].includes(x))) return i;
  }
  return -1;
}
const COLS = {
  date:{ exact:['datum','date','bestelldatum','kaufdatum','purchase-date','order-date','purchase date','order date'],
         contains:['datum','date'], exclude:['versand','ship','update','geändert','last','delivery','liefer'] },
  sku:{  exact:['sku','seller-sku','seller sku','händler-sku','haendler-sku','msku','artikelnummer'],
         contains:['sku'], exclude:['fnsku'] },
  asin:{ exact:['asin','(untergeordnete) asin','(child) asin'], contains:['asin'], exclude:['übergeordnete','parent'] },
  units:{exact:['bestellte einheiten','units ordered','quantity','quantity-purchased','menge','anzahl','einheiten','verkaufte einheiten','bestellte artikel','ordered units'],
         contains:['einheiten','units','menge','quantity','anzahl'], exclude:['b2b','umsatz','sales','prozent','%','pro bestellung','durchschn','revenue'] }
};
/* Amazon-FBA-Bestandsspalten (Rapport "Alle Bestellungen" mit FBA-Lagerbestand). Nur exakte,
   stabile Amazon-Spaltennamen – wenn sie fehlen, bleibt der FBA-Bestand einfach leer (kein Fehler). */
const STOCK_COLS = {
  channel:['fulfillment-channel'],
  status:['order-status'],
  itemStatus:['item-status'],
  updated:['last-updated-date'],
  verf:['afn-fulfillable-quantity'],
  reserved:['afn-reserved-quantity'],
  total:['afn-total-quantity'],
  working:['afn-inbound-working-quantity'],
  shipped:['afn-inbound-shipped-quantity'],
  receiving:['afn-inbound-receiving-quantity']
};
const CANCEL_RE = /storn|cancel|annul|refund|erstatt|rembours/;
function findExact(h, names){ for(const n of names){ const i=h.indexOf(n); if(i>=0) return i; } return -1; }

/* Liefert { data:{sku:{iso:units}}, fba:{sku:{verf,reserved,zulauf,total}}, info } oder wirft einen Error */
function buildFromCsv(text){
  const rows=parseDelimited(text, detectDelimiter(text));
  if(rows.length<2) throw new Error('Die Datei enthält keine Datenzeilen.');
  let hi=-1, c=null;
  for(let i=0;i<Math.min(15,rows.length);i++){
    const h=rows[i].map(norm);
    const date=findCol(h,COLS.date.exact,COLS.date.contains,COLS.date.exclude);
    const units=findCol(h,COLS.units.exact,COLS.units.contains,COLS.units.exclude);
    if(date>=0&&units>=0&&date!==units){
      let sku=findCol(h,COLS.sku.exact,COLS.sku.contains,COLS.sku.exclude);
      if(sku<0) sku=findCol(h,COLS.asin.exact,COLS.asin.contains,COLS.asin.exclude);
      const s={
        date, units, sku,
        channel:findExact(h,STOCK_COLS.channel), status:findExact(h,STOCK_COLS.status),
        itemStatus:findExact(h,STOCK_COLS.itemStatus), updated:findExact(h,STOCK_COLS.updated),
        verf:findExact(h,STOCK_COLS.verf), reserved:findExact(h,STOCK_COLS.reserved),
        total:findExact(h,STOCK_COLS.total), working:findExact(h,STOCK_COLS.working),
        shipped:findExact(h,STOCK_COLS.shipped), receiving:findExact(h,STOCK_COLS.receiving)
      };
      hi=i; c=s; break;
    }
  }
  if(hi<0){
    const first=rows[0].map(x=>x.trim()).filter(Boolean).slice(0,12).join(' | ');
    throw new Error('Spalten nicht erkannt. Benötigt werden mindestens ein Datum und eine Menge (z. B. „Bestelldatum“ und „Bestellte Einheiten“). Gefundene Spalten: '+first);
  }
  const data={}, fba={}, fbaSeen={};
  let used=0, skipped=0, cancelled=0, minD=Infinity, maxD=-Infinity;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];
    const sku = c.sku>=0 ? String(r[c.sku]||'').trim() : 'Alle Artikel';

    // --- FBA-Bestand: einmal je SKU übernehmen, nie über Zeilen aufsummieren ---
    if(sku && c.verf>=0){
      const chan = c.channel>=0 ? norm(r[c.channel]) : '';
      const isFba = c.channel<0 || chan==='amazon';
      const verfRaw = parseUnits(r[c.verf]);
      if(isFba && isFinite(verfRaw)){
        const upd = c.updated>=0 ? (parseDate(r[c.updated])||0) : 0;
        if(!fbaSeen[sku] || upd>=fbaSeen[sku]){
          fbaSeen[sku]=upd;
          const g=(idx)=>{ const v=c[idx]>=0?parseUnits(r[c[idx]]):NaN; return isFinite(v)?v:0; };
          const working=g('working'), shipped=g('shipped'), receiving=g('receiving');
          fba[sku]={ verf:verfRaw, reserved:g('reserved'), total:g('total'), working, shipped, receiving, zulauf:working+shipped+receiving };
        }
      }
    }

    // --- Verkäufe: nur gültige, nicht stornierte Bestellzeilen ---
    const st1 = c.status>=0 ? String(r[c.status]||'') : '';
    const st2 = c.itemStatus>=0 ? String(r[c.itemStatus]||'') : '';
    if(CANCEL_RE.test(st1.toLowerCase())||CANCEL_RE.test(st2.toLowerCase())){ cancelled++; continue; }
    const d=parseDate(r[c.date]); const u=parseUnits(r[c.units]);
    if(d==null||!(u>0)){ skipped++; continue; }
    if(!sku){ skipped++; continue; }
    const iso=dnToIso(d);
    (data[sku]=data[sku]||{})[iso]=((data[sku]||{})[iso]||0)+u;
    used++; if(d<minD) minD=d; if(d>maxD) maxD=d;
  }
  if(!used) throw new Error('Keine gültigen Zeilen gefunden (Datum und Menge > 0). '+skipped+' Zeilen übersprungen.');
  return { data, fba, info:{ used, skipped, cancelled, from:minD, to:maxD, hasSku:c.sku>=0, hasStock:c.verf>=0 } };
}

/* ------------------------------ Demo-Daten --------------------------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function demoData(endDn){
  const rnd=mulberry32(20260921);
  // [SKU, Grundniveau Stück/Tag, Alter in Tagen]
  const defs=[
    ['H07V-K-10-Set10-fba',4.2,250],['H07V-K-10-Set9-fba',2.6,300],['H07V-K-10-Set6-fba',1.4,180],
    ['H07V-K-10-Set11-fba',2.0,330],['H07V-K-10-Set12-fba',1.0,140],['H07V-K-10-Set13-fba',2.5,220],
    ['H07V-K-6-Set5-fba',1.6,520],['H07V-K-6-Set9-fba',0.8,120]
  ];
  const season={1:.55,2:.8,3:.9,4:1.6,5:1.3,6:1.35,7:1.3,8:1.0,9:1.2,10:.9,11:.8,12:.7};
  const data={};
  for(const [sku,base,age] of defs){
    data[sku]={};
    for(let d=endDn-age+1; d<=endDn; d++){
      const a=d-(endDn-age+1);
      const ramp=Math.min(1,(a+1)/45);
      const wk=(weekdayOf(d)===0||weekdayOf(d)===6)?0.8:1.05;
      const mean=base*ramp*season[monthOf(d)]*wk;
      const u=Math.round(mean*(0.4+1.2*rnd()));
      if(u>0) data[sku][dnToIso(d)]=u;
    }
  }
  return data;
}
const DEMO_STOCK = {'H07V-K-10-Set10-fba':70,'H07V-K-10-Set9-fba':40,'H07V-K-10-Set6-fba':15,'H07V-K-10-Set11-fba':60,'H07V-K-10-Set12-fba':10,'H07V-K-10-Set13-fba':80,'H07V-K-6-Set5-fba':25,'H07V-K-6-Set9-fba':30};
const DEMO_FBA = Object.fromEntries(Object.entries(DEMO_STOCK).map(([sku,verf],i)=>{
  const reserved=Math.round(verf*0.08), working=i%3===0?Math.round(verf*0.15):0, shipped=i%2===0?Math.round(verf*0.1):0, receiving=0;
  return [sku,{ verf, reserved, working, shipped, receiving, zulauf:working+shipped+receiving, total:verf+reserved }];
}));

/* ------------------------------ Prognose ----------------------------- */
function toMaps(data){
  const maps={}; let ref=-Infinity;
  for(const sku of Object.keys(data)){
    const m={};
    for(const iso of Object.keys(data[sku])){ const d=isoToDn(iso); if(d!=null){ m[d]=data[sku][iso]; if(d>ref) ref=d; } }
    maps[sku]=m;
  }
  return { maps, ref };
}
function sumRange(m,a,b){ let s=0; for(let d=a; d<=b; d++){ const v=m[d]; if(v) s+=v; } return s; }
function firstDay(m){ let f=Infinity; for(const k in m){ const n=+k; if(n<f) f=n; } return f; }

function forecastSku(m, ref, H, safety, stock){
  const hist=Math.max(1, ref-firstDay(m)+1);
  const r={};
  for(const n of [7,30,90]){ const eff=Math.min(n,hist); r[n]=sumRange(m,ref-eff+1,ref)/eff; }
  const base=0.5*r[7]+0.3*r[30]+0.2*r[90];
  let factor=1, ratio=null;
  if(hist>=395){
    const ly30=sumRange(m,ref-394,ref-365);
    const lyH =sumRange(m,ref-364,ref-365+H);
    if(ly30>0){ ratio=Math.min(1.8,Math.max(0.6,(lyH/H)/(ly30/30))); factor=1+0.5*(ratio-1); }
  }
  const daily=base*factor;
  const demand=daily*H;
  const target=demand*(1+safety/100);
  const send=Math.max(0,Math.ceil(target-stock-1e-9));
  return { r7:r[7], r30:r[30], r90:r[90], base, factor, ratio, daily, demand, target, stock,
           send, cover: daily>0 ? stock/daily : null, trend: r[30]>0 ? r[7]/r[30]-1 : null, hist };
}

function skuInfo(sku){
  if(SKU_MAP[sku]){
    const x=SKU_MAP[sku];
    return { set:x.set||sku, qs:x.qs||'–', colors:x.colors||COLORS_DEFAULT, mPerColor:x.mPerColor!=null?x.mPerColor:M_PER_COLOR_DEFAULT, known:true };
  }
  const m=/H07V-K-(\d+(?:[.,]\d+)?)-Set(\d+)/i.exec(sku);
  if(m) return { set:'SET'+m[2], qs:m[1].replace(',','.')+' mm²', colors:COLORS_DEFAULT, mPerColor:M_PER_COLOR_DEFAULT, known:true };
  return { set:sku, qs:'–', colors:[], mPerColor:0, known:false };
}

function compute(state, maps, ref){
  const s=state.settings;
  const H=s.lead+s.cover;
  const fba=state.fba||{};
  const skus=Object.keys(maps).sort((a,b)=>a.localeCompare(b,'de',{numeric:true}));
  const items=skus.map(sku=>({
    sku, info:skuInfo(sku), fba:fba[sku]||null,
    f:forecastSku(maps[sku],ref,H,s.safety,Math.max(0,+s.stock[sku]||0))
  }));
  const groups={};
  for(const it of items){
    if(it.f.send<=0) continue;
    const key=it.info.set+'|'+it.info.qs;
    const g=groups[key]=groups[key]||{ set:it.info.set, qs:it.info.qs, colors:it.info.colors, mPerColor:it.info.mPerColor, known:it.info.known, sets:0 };
    g.sets+=it.f.send;
  }
  const list=Object.values(groups).map(g=>({ ...g, perColor:g.sets*g.mPerColor, meters:g.sets*g.mPerColor*g.colors.length }))
    .sort((a,b)=>(b.known-a.known)||a.set.localeCompare(b.set,'de',{numeric:true})||a.qs.localeCompare(b.qs,'de',{numeric:true}));
  return { H, items, list, ref,
           totalSets:list.reduce((a,g)=>a+g.sets,0), totalMeters:list.reduce((a,g)=>a+g.meters,0),
           totalVerf:items.reduce((a,it)=>a+it.f.stock,0),
           totalReserved:items.reduce((a,it)=>a+(it.fba?it.fba.reserved:0),0),
           totalZulauf:items.reduce((a,it)=>a+(it.fba?it.fba.zulauf:0),0),
           fbaCount:items.filter(it=>it.fba).length };
}

function weeklySeries(maps, skus, ref, weeks){
  const out=[];
  let first=Infinity; for(const s of skus){ const f=firstDay(maps[s]); if(f<first) first=f; }
  for(let i=weeks-1;i>=0;i--){
    const to=ref-7*i, from=to-6;
    if(to<first) continue;
    let u=0; for(const s of skus) u+=sumRange(maps[s],from,to);
    out.push({ to, u });
  }
  return out;
}

/* -------------------------------- Chart ------------------------------ */
function chartSvg(hist, fc){
  const W=920, Ht=300, pl=48, pr=14, pt=14, pb=34;
  const vals=hist.map(h=>h.u).concat(fc.map(f=>f.u));
  const max=Math.max(1,...vals);
  const raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=mag; for(const k of [1,2,2.5,5,10]){ if(k*mag>=raw){ step=k*mag; break; } }
  const ymax=step*4, n=hist.length+fc.length;
  const x=i=>pl+(n>1 ? i*(W-pl-pr)/(n-1) : 0);
  const y=v=>pt+(Ht-pt-pb)*(1-v/ymax);
  let g='';
  for(let k=0;k<=4;k++){
    const v=step*k, yy=y(v);
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.1)"/>`;
    g+=`<text x="${pl-8}" y="${yy+4}" text-anchor="end" fill="#94a6cc" font-size="12">${Math.round(v*10)/10}</text>`;
  }
  const pts=hist.map((h,i)=>[x(i),y(h.u)]);
  let line='', area='';
  if(pts.length){
    line='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    area=line+` L${pts[pts.length-1][0].toFixed(1)},${y(0)} L${pts[0][0].toFixed(1)},${y(0)} Z`;
  }
  let fline='';
  if(fc.length&&pts.length){
    const fp=fc.map((f,j)=>[x(hist.length+j),y(f.u)]);
    fline='M'+pts[pts.length-1][0].toFixed(1)+','+pts[pts.length-1][1].toFixed(1)+' L'+fp.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  }
  const every=Math.max(1,Math.round(n/8));
  let lab='';
  const all=hist.map(h=>h.to).concat(fc.map(f=>f.to));
  for(let i=0;i<all.length;i+=every){
    lab+=`<text x="${x(i)}" y="${Ht-10}" text-anchor="middle" fill="#94a6cc" font-size="12">${dnToShort(all[i])}</text>`;
  }
  const dx=pts.length?pts[pts.length-1][0]:pl;
  let dots='';
  hist.forEach((h,i)=>{ dots+=`<circle cx="${x(i)}" cy="${y(h.u)}" r="6" fill="transparent"><title>Woche bis ${dnToDe(h.to)}: ${h.u} Stück</title></circle>`; });
  fc.forEach((f,j)=>{ dots+=`<circle cx="${x(hist.length+j)}" cy="${y(f.u)}" r="6" fill="transparent"><title>Prognose Woche bis ${dnToDe(f.to)}: ${Math.round(f.u)} Stück</title></circle>`; });
  return `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Wöchentliche Verkäufe und Prognose">
    <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8f23d" stop-opacity=".28"/><stop offset="1" stop-color="#c8f23d" stop-opacity="0"/></linearGradient></defs>
    ${g}
    ${area?`<path d="${area}" fill="url(#gA)"/>`:''}
    ${line?`<path d="${line}" fill="none" stroke="#c8f23d" stroke-width="2.4" stroke-linejoin="round"/>`:''}
    ${fc.length?`<line x1="${dx}" x2="${dx}" y1="${pt}" y2="${Ht-pb}" stroke="rgba(255,255,255,.35)" stroke-dasharray="2 4"/><text x="${dx+8}" y="${pt+12}" fill="#94a6cc" font-size="12">Prognose</text>`:''}
    ${fline?`<path d="${fline}" fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="6 5" stroke-linejoin="round"/>`:''}
    ${lab}${dots}</svg>`;
}

/* ----------------------------- CSV-Export ---------------------------- */
function listToCsv(res){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[['Set','Querschnitt','Farben','Anzahl Sets','Meter je Farbe','Gesamtmeter'].map(q).join(';')];
  for(const g of res.list){
    lines.push([g.set,g.qs,g.colors.join(', '),g.sets,g.mPerColor?String(g.perColor).replace('.',','):'',g.mPerColor?String(g.meters).replace('.',','):''].map(q).join(';'));
  }
  return '\ufeff'+lines.join('\r\n');
}

  function render(){

    const b=e.target.closest('[data-act]'); if(!b) return;
    const a=b.dataset.act;
    if(a==='pick') document.getElementById('file').click();
    else if(a==='demo') startDemo();
    else if(a==='reset'){ if(!ui.confirmReset){ ui.confirmReset=true; render(); } else { ui.confirmReset=false; try{ localStorage.removeItem(STORE_KEY); }catch(_){} state=null; maps=null; ref=null; error=''; render(); } }
    else if(a==='print') window.print();
    else if(a==='csv'){
      const res=compute(state,maps,ref);
      const text=listToCsv(res), fname='produktionsliste-'+dnToIso(Math.floor(Date.now()/DAY))+'.csv';
      (async()=>{
        try{
          const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
          if(dl){ await dl.save({ filename:fname, data:text }); return; }
        }catch(err){ if(err && err.code==='declined') return; }
        const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
        const url=URL.createObjectURL(blob), l=document.createElement('a');
        l.href=url; l.download=fname;
        document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
      })();
    }
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='file'){ readFile(t.files[0]); t.value=''; return; }
    if(!state) return;
    if(t.dataset.set){
      const lim={lead:[0,120],cover:[1,180],safety:[0,200]}[t.dataset.set];
      let v=parseInt(t.value,10); if(!isFinite(v)) v=defaults()[t.dataset.set];
      state.settings[t.dataset.set]=Math.min(lim[1],Math.max(lim[0],v));
      save(); render();
    } else if(t.dataset.stock!==undefined){
      const v=Math.max(0,parseInt(t.value,10)||0);
      state.settings.stock[t.dataset.stock]=v; save(); render();
    } else if(t.hasAttribute('data-chart')){ ui.chart=t.value; render(); }
  });

  load(); render();
})();
}
</script>
</body>
</html>
